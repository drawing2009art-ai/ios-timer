name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reset Capacitor config
        run: |
          rm -f capacitor.config.ts capacitor.config.js
          echo '{"appId":"com.example.timer","appName":"Timer","webDir":"www","ios":{"contentInset":"never"}}' > capacitor.config.json
      - run: npm install
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build (unsigned)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Timer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Timer-ipa
          path: Timer.ipa
